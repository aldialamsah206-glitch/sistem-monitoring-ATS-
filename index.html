<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Monitoring Daya</title>
  <!-- Firebase SDK (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    h1 {
      color: #f8fafc;
      text-align: center;
      margin-bottom: 30px;
      font-weight: 300;
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.2s, box-shadow 0.3s;
      text-align: center;
      color: #e2e8f0;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
    }
    .card h3 {
      font-size: 1.1rem;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    .card .value {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      transition: color 0.3s;
    }
    .card .unit {
      font-size: 1.2rem;
      font-weight: 300;
      color: #94a3b8;
    }
    .card .status {
      font-size: 0.9rem;
      margin-top: 10px;
      padding: 4px 12px;
      border-radius: 30px;
      display: inline-block;
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
    }
    .card-pln-arus .value { color: #f59e0b; }
    .card-pln-tegangan .value { color: #3b82f6; }
    .card-inv-arus .value { color: #10b981; }
    .card-inv-tegangan .value { color: #8b5cf6; }

    .timestamp {
      text-align: center;
      margin-top: 30px;
      color: #64748b;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    .timestamp span {
      color: #94a3b8;
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .card .value { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ MONITORING SISTEM DAYA</h1>
    <div class="dashboard">
      <div class="card card-pln-arus">
        <h3>Arus PLN</h3>
        <div class="value" id="pln-arus">--</div>
        <div class="unit">A</div>
        <div class="status" id="pln-arus-status">Menunggu data...</div>
      </div>
      <div class="card card-pln-tegangan">
        <h3>Tegangan PLN</h3>
        <div class="value" id="pln-tegangan">--</div>
        <div class="unit">V</div>
        <div class="status" id="pln-tegangan-status">Menunggu data...</div>
      </div>
      <div class="card card-inv-arus">
        <h3>Arus Inverter</h3>
        <div class="value" id="inv-arus">--</div>
        <div class="unit">A</div>
        <div class="status" id="inv-arus-status">Menunggu data...</div>
      </div>
      <div class="card card-inv-tegangan">
        <h3>Tegangan Inverter</h3>
        <div class="value" id="inv-tegangan">--</div>
        <div class="unit">V</div>
        <div class="status" id="inv-tegangan-status">Menunggu data...</div>
      </div>
    </div>
    <div class="timestamp">
      Terakhir diperbarui: <span id="last-update">--</span>
    </div>
  </div>

  <script>
    // =======================================================
    //  KONFIGURASI FIREBASE – GANTI DENGAN DATA PROYEK ANDA
    // =======================================================
    const firebaseConfig = {
      apiKey: "AIzaSy...",               // ganti dengan API Key Anda
      authDomain: "your-project.firebaseapp.com",
      databaseURL: "https://your-project-default-rtdb.firebaseio.com",
      projectId: "your-project",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const sensorsRef = database.ref('/sensors');

    // Elemen DOM
    const elArusPLN = document.getElementById('pln-arus');
    const elTegPLN = document.getElementById('pln-tegangan');
    const elArusINV = document.getElementById('inv-arus');
    const elTegINV = document.getElementById('inv-tegangan');
    const elStatusArusPLN = document.getElementById('pln-arus-status');
    const elStatusTegPLN = document.getElementById('pln-tegangan-status');
    const elStatusArusINV = document.getElementById('inv-arus-status');
    const elStatusTegINV = document.getElementById('inv-tegangan-status');
    const elLastUpdate = document.getElementById('last-update');

    // Fungsi update tampilan
    function updateDashboard(data) {
      if (!data) return;
      const arusPLN = data.pln_arus !== undefined ? data.pln_arus.toFixed(2) : '--';
      const tegPLN = data.pln_tegangan !== undefined ? data.pln_tegangan.toFixed(1) : '--';
      const arusINV = data.inverter_arus !== undefined ? data.inverter_arus.toFixed(2) : '--';
      const tegINV = data.inverter_tegangan !== undefined ? data.inverter_tegangan.toFixed(1) : '--';

      elArusPLN.textContent = arusPLN;
      elTegPLN.textContent = tegPLN;
      elArusINV.textContent = arusINV;
      elTegINV.textContent = tegINV;

      elStatusArusPLN.textContent = (arusPLN !== '--') ? '● Normal' : 'Tidak ada data';
      elStatusTegPLN.textContent = (tegPLN !== '--') ? '● Normal' : 'Tidak ada data';
      elStatusArusINV.textContent = (arusINV !== '--') ? '● Normal' : 'Tidak ada data';
      elStatusTegINV.textContent = (tegINV !== '--') ? '● Normal' : 'Tidak ada data';

      if (data.timestamp) {
        const ts = new Date(data.timestamp);
        elLastUpdate.textContent = ts.toLocaleString('id-ID');
      } else {
        elLastUpdate.textContent = new Date().toLocaleString('id-ID');
      }
    }

    // Mendengarkan perubahan real‑time
    sensorsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) updateDashboard(data);
      else {
        document.querySelectorAll('.value').forEach(el => el.textContent = '--');
        document.querySelectorAll('.status').forEach(el => el.textContent = 'Tidak ada data');
        elLastUpdate.textContent = 'Belum ada data';
      }
    }, (error) => console.error('Gagal membaca data:', error));

    // Ambil data awal sekali
    sensorsRef.once('value').then((snapshot) => {
      const data = snapshot.val();
      if (data) updateDashboard(data);
    });
  </script>
</body>
</html>
